services:
  postgres:
    image: postgres:17.5
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: hatsuportal_test
    volumes:
      - ./init-test.sh:/docker-entrypoint-initdb.d/01-init-test.sh:ro
      - ../backend/migrations:/migrations:ro
      - ../backend/seeds:/seeds:ro
